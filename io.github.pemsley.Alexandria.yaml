app-id: io.github.pemsley.Alexandria
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: alexandria-browse
build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
finish-args:
  - --share=network  # CrossRef / OpenAlex / arXiv API calls
  - --share=ipc  # X11 shared-memory transport
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri  # GPU acceleration
  - --filesystem=xdg-documents  # PDF library (default ~/Documents/Alexandria) + sidecar JSON files
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/gtk-doc
  - '*.a'
  - '*.la'

modules:
  - name: poppler-data
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74

  # Provides gi.repository.Poppler (viewer, references panel)
  # and /app/bin/pdftotext (metadata extraction pipeline).
  # Not in the GNOME Platform runtime — must be bundled.
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=ON
      - -DENABLE_UTILS=ON
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DWITH_NSS3=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-24.11.0.tar.xz
        sha256: 7723d880565211740c13649d24a300257b86ddd7fa2d208187ff7e5cc8dfbd58

  # Offline-buildable wheels + sha256s, generated from `./python-deps.sh`.
  - python-deps.yaml

  - name: alexandria
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 COPYING /app/share/licenses/io.github.pemsley.Alexandria/COPYING
      - install -Dm644 data/io.github.pemsley.Alexandria.desktop /app/share/applications/io.github.pemsley.Alexandria.desktop
      - install -Dm644 data/io.github.pemsley.Alexandria.svg /app/share/icons/hicolor/scalable/apps/io.github.pemsley.Alexandria.svg
      - install -Dm644 data/io.github.pemsley.Alexandria.metainfo.xml /app/share/metainfo/io.github.pemsley.Alexandria.metainfo.xml
    sources:
      - type: git
        url: https://github.com/pemsley/Alexandria.git
        tag: v0.2.0
        commit: 550f1daf2d02ee154c2585231b977b913d4c5eab
      - type: patch
        path: fix-console-script-argv-default.patch
