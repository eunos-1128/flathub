app-id: io.github.pemsley.Alexandria

# Python 3.13, PyGObject, Pycairo, GTK 4, libadwaita SQLite (including Python's sqlite3 module),
# GLib/GObject/GIO, GDK, Cairo and Pango are provided by
# org.gnome.Platform//50.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: alexandria-browse
build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
finish-args:
  - --share=network  # CrossRef / OpenAlex / arXiv API calls
  - --share=ipc  # X11 shared-memory transport
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri  # GPU acceleration
  - --filesystem=xdg-documents  # PDF library (default ~/Documents/Alexandria) + sidecar JSON files
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/gtk-doc
  - '*.a'
  - '*.la'

modules:
  # Additional CMap and encoding data used by Poppler, particularly for
  # CJK PDFs. Not provided by org.gnome.Platform//50, so it is bundled.
  - name: poppler-data
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74
        x-checker-data:
          type: anitya
          project-id: 3687
          stable-only: true
          url-template: https://poppler.freedesktop.org/poppler-data-$version.tar.gz

  # Poppler's GLib bindings, GObject Introspection typelib and command-line
  # utilities are not provided by org.gnome.Platform//50.
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=ON
      - -DENABLE_UTILS=ON
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DWITH_NSS3=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-24.11.0.tar.xz
        sha256: 7723d880565211740c13649d24a300257b86ddd7fa2d208187ff7e5cc8dfbd58
        x-checker-data:
          type: anitya
          project-id: 3686
          stable-only: true
          url-template: https://poppler.freedesktop.org/poppler-$version.tar.xz

  # Python 3 and PyGObject are provided by org.gnome.Platform//50.
  # Application-specific Python packages and their transitive dependencies
  # are bundled below for offline builds.
  - python-deps.yaml

  - name: alexandria
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 COPYING /app/share/licenses/io.github.pemsley.Alexandria/COPYING
      - install -Dm644 data/io.github.pemsley.Alexandria.desktop /app/share/applications/io.github.pemsley.Alexandria.desktop
      - install -Dm644 data/io.github.pemsley.Alexandria.svg /app/share/icons/hicolor/scalable/apps/io.github.pemsley.Alexandria.svg
      - install -Dm644 data/io.github.pemsley.Alexandria.metainfo.xml /app/share/metainfo/io.github.pemsley.Alexandria.metainfo.xml
    sources:
      - type: git
        url: https://github.com/pemsley/Alexandria.git
        tag: Release-0.2.0
        commit: 9db42a4ecbca430710379976b94c23b3928aa289
        x-checker-data:
          type: git
          tag-pattern: ^Release-([\d.]+)$
          is-main-source: true
